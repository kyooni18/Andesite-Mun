name: ci

on:
  push:
  pull_request:

env:
  # The server branch that has the /v1/vaults routes, browser sessions and docs/schemas.
  ANDESITE_REF: claude/multi-platform-ui-plan-6q4n0e

jobs:
  # andesite-server for Linux, built once and handed to the web job.
  server:
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev git ca-certificates >/dev/null
      - uses: actions/checkout@v4
        with:
          repository: kyooni18/Andesite
          ref: ${{ env.ANDESITE_REF }}
          token: ${{ secrets.ANDESITE_REPO_TOKEN || github.token }}
          path: Andesite
      - run: swift build -c release --product andesite-server --static-swift-stdlib
        working-directory: Andesite
      - run: cp "$(swift build -c release --show-bin-path)/andesite-server" ../andesite-server
        working-directory: Andesite
      - uses: actions/upload-artifact@v4
        with:
          name: andesite-server
          path: andesite-server
      - uses: actions/upload-artifact@v4
        with:
          name: andesite-deploy
          path: |
            Andesite/deploy/nginx.conf
            Andesite/docs/schemas

  web:
    needs: server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: andesite-server
          path: server
      - uses: actions/download-artifact@v4
        with:
          name: andesite-deploy
          path: andesite
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx-light libsqlite3-0 >/dev/null
      # @mun-ui/ui 0.2.0 on npm has no desktop target and a compiler that predates this app, so the
      # app links a checkout of Mün pinned in MUN_REF (see README).
      - name: Build Mün
        run: |
          git clone https://github.com/kyooni18/mun ../mun
          git -C ../mun checkout "$(cat MUN_REF)"
          cd ../mun
          pnpm install --frozen-lockfile
          pnpm add -w -D @types/node@22
          pnpm build
      - run: pnpm run link:mun ../mun
      - name: Generated API types are up to date
        run: |
          node scripts/gen-types.mjs andesite/docs/schemas
          git diff --exit-code -- src/api/schemas
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: node scripts/desktop-check.mjs
      - name: End-to-end tests against andesite-server and the deployment's nginx.conf
        run: |
          chmod +x server/andesite-server
          pnpm exec playwright install --with-deps chromium
          pnpm run e2e
        env:
          CI: 'true'
          ANDESITE_SERVER_BIN: ${{ github.workspace }}/server/andesite-server
          ANDESITE_REPO: ${{ github.workspace }}/andesite
          NGINX_BIN: /usr/sbin/nginx
          NGINX_MIME_TYPES: /etc/nginx/mime.types
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            docs/screenshots

  desktop:
    # The shell compiles against the system WebView; this proves the Tauri target builds on Linux.
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev build-essential pkg-config >/dev/null
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Mün
        run: |
          git clone https://github.com/kyooni18/mun ../mun
          git -C ../mun checkout "$(cat MUN_REF)"
          cd ../mun && pnpm install --frozen-lockfile && pnpm add -w -D @types/node@22 && pnpm build
      - run: pnpm run link:mun ../mun
      - run: pnpm run desktop:check -- --cargo
